# Slurm NodeSet Autoscaler — Queue-Driven Scale-Up/Down
#
# Monitors Slurm queue demand and scales the NodeSet to match pending/running
# job node requirements. Scales back to MIN_REPLICAS after idle periods.
#
# Deploy:   ./scripts/deploy-autoscale.sh
# Remove:   ./scripts/deploy-autoscale.sh --teardown

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slurm-autoscaler
  namespace: slurm

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: slurm-autoscaler
  namespace: slurm
rules:
  - apiGroups: ["slinky.slurm.net"]
    resources: ["nodesets", "nodesets/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: slurm-autoscaler
  namespace: slurm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: slurm-autoscaler
subjects:
  - kind: ServiceAccount
    name: slurm-autoscaler
    namespace: slurm

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slurm-autoscaler
  namespace: slurm
  labels:
    app.kubernetes.io/name: slurm-autoscaler
    app.kubernetes.io/part-of: slurm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slurm-autoscaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slurm-autoscaler
        app.kubernetes.io/part-of: slurm
    spec:
      serviceAccountName: slurm-autoscaler
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: autoscaler
          # bitnami/kubectl was deprecated (Bitnami stopped publishing free,
          # version-pinned tags on Docker Hub) — "bitnami/kubectl:1.29" now
          # 404s with "manifest unknown". alpine/k8s is actively maintained,
          # multi-arch, and ships both kubectl and a shell (needed for
          # autoscaler.sh, which runs via /bin/sh).
          image: alpine/k8s:1.34.9
          command: ["/bin/sh", "/scripts/autoscaler.sh"]
          env:
            - name: NAMESPACE
              value: "slurm"
            - name: NODESET
              value: "slurm-worker-slinky"
            - name: MIN_REPLICAS
              value: "0"
            - name: MAX_REPLICAS
              value: "8"
            - name: POLL_INTERVAL
              value: "30"
            - name: SCALE_DOWN_DELAY
              value: "300"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: scripts
          configMap:
            name: slurm-autoscaler-script
            defaultMode: 0755
